name: Test Objective-C brush

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use preinstalled Node and check JavaScript syntax
        run: |
          node --version
          node --check scripts/shCore.js
          node --check scripts/shBrushObjC.js
          node --check tests/brush.test.cjs
      - name: Test the actual bundled highlighter and brush
        run: node --test tests/brush.test.cjs
      - name: Verify tracked source was preserved
        run: git diff --quiet --exit-code
